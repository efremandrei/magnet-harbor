name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MagnetHarbor-v0.1.0-debug.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 MagnetHarbor-v0.1.0-debug.apk --clobber
          else
            gh release create v0.1.0 MagnetHarbor-v0.1.0-debug.apk \
              --title "Magnet Harbor v0.1.0" \
              --notes "Initial Android MVP debug build. For testing only."
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetHarbor-debug-apk
          path: MagnetHarbor-v0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
